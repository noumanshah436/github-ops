<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>github-ops · GitHub PR and Actions console</title>

    <meta name="application-name" content="github-ops" />
    <meta
      name="description"
      content="A local web app for everyday GitHub work: create, review, approve and merge pull requests, and monitor GitHub Actions runs and logs."
    />
    <meta name="author" content="Syed Nouman" />
    <meta name="generator" content="React + Vite" />

    <!-- Keep this application out of search engine indexes. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Browser theme support, matching the top bar in light and dark mode. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#010409" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph metadata. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="github-ops" />
    <meta property="og:title" content="github-ops · GitHub PR and Actions console" />
    <meta
      property="og:description"
      content="Create, review, approve and merge pull requests, and monitor GitHub Actions from one local app."
    />
    <meta property="og:image" content="/logo.svg" />

    <!-- Twitter/X preview. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="github-ops · GitHub PR and Actions console" />
    <meta name="twitter:description" content="Manage GitHub pull requests and Actions from one local app." />

    <!-- Application icons. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
