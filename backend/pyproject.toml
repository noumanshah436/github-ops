[project]
name = "gh-ops-backend"
version = "0.1.0"
description = "Local GitHub PR and Actions console: token store and GitHub API proxy"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pyright>=1.1.396",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.4,<0.18",  # ruff minor releases change rules
]

[tool.uv]
package = false

# Run `bash scripts/local_ci.sh` (or `make lint`).
[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "run.py"]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP", "FAST", "PT", "FURB", "RUF006", "RUF012", "RUF015", "RUF100", "ASYNC", "C4", "DTZ", "B", "FBT"]
ignore = ["E731", "PT018", "B905", "FBT001", "FBT002"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
